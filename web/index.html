<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumos Cockpit - Return Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <style>
    :root {
      --bg-main: #090d13;
      --bg-card: #131b26;
      --border-subtle: #233144;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-sans); padding: 30px; }
    .header { margin-bottom: 30px; text-align: center; }
    .header h1 { font-size: 28px; font-weight: 700; }
    .charts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; text-align: center; color: var(--text-main); }
    .chart-container { position: relative; height: 300px; width: 100%; }
    .stats-text { margin-top: 15px; font-size: 13px; color: var(--text-muted); text-align: center; font-weight: 600; white-space: pre-line; line-height: 1.4; }
    
    .table-container {
      max-height: 280px;
      overflow-y: auto;
      margin-top: 15px;
      border-top: 1px solid var(--border-subtle);
    }
    .table-container::-webkit-scrollbar { width: 4px; }
    .table-container::-webkit-scrollbar-track { background: transparent; }
    .table-container::-webkit-scrollbar-thumb { background: #233144; border-radius: 2px; }
    .trade-table { width: 100%; border-collapse: collapse; font-size: 11px; color: var(--text-muted); }
    .trade-table th, .trade-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
    .trade-table th { font-weight: 600; color: var(--text-main); position: sticky; top: 0; background: var(--bg-card); z-index: 2; border-bottom: 2px solid var(--border-subtle); }
    .win-text { color: #10b981; font-weight: 600; }
    .loss-text { color: #e74c3c; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Lumos Performance Dashboard</h1>
    <p style="color: var(--text-muted); margin-top: 5px;">달러 누적(Bar) & 수익률 복리 곡선(Line)</p>
  </div>
  <div class="charts-grid">
    <div class="card">
      <div class="card-title">월별 성과 (올해 누적)</div>
      <div class="chart-container"><canvas id="chartMonthly"></canvas></div>
      <div id="statsMonthly" class="stats-text"></div>
      <div class="table-container"><table class="trade-table" id="tableMonthly"></table></div>
    </div>
    <div class="card">
      <div class="card-title">주별 성과 (이번 주 누적 / 최근 5주)</div>
      <div class="chart-container"><canvas id="chartWeekly"></canvas></div>
      <div id="statsWeekly" class="stats-text"></div>
      <div class="table-container"><table class="trade-table" id="tableWeekly"></table></div>
    </div>
    <div class="card">
      <div class="card-title">일별 성과 (최근 14일)</div>
      <div class="chart-container"><canvas id="chartDaily"></canvas></div>
      <div id="statsDaily" class="stats-text"></div>
      <div class="table-container"><table class="trade-table" id="tableDaily"></table></div>
    </div>
  </div>
  <script>
    Chart.register(ChartDataLabels);

    async function fetchCharts() {
      try {
        const res = await fetch('/api/return_charts');
        const data = await res.json();
        if (data.error) return console.error(data.error);

        const commonOptions = {
          responsive: true, maintainAspectRatio: false,
          plugins: { 
            legend: { position: 'top', labels: { color: '#94a3b8' } },
            datalabels: {
              font: { weight: 'bold', size: 10 },
              formatter: function(value, context) {
                if (value === null) return '';
                if(context.dataset.type === 'line') {
                  return value.toFixed(2) + '%';
                } else {
                  return Math.round(value).toLocaleString();
                }
              }
            }
          },
          scales: {
            yUsd: { type: 'linear', position: 'left', grid: { color: '#233144' }, ticks: { color: '#38bdf8', callback: v => v.toLocaleString() } },
            yPct: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#e74c3c', callback: v => v + '%' } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          }
        };

        const createChart = (ctxId, chartData, colorBar) => {
          new Chart(document.getElementById(ctxId), {
            type: 'bar',
            data: {
              labels: chartData.labels,
              datasets: [
                {
                  type: 'line',
                  label: 'Yield (%)',
                  data: chartData.pct,
                  borderColor: '#e74c3c',
                  backgroundColor: '#e74c3c',
                  borderWidth: 2,
                  yAxisID: 'yPct',
                  tension: 0.1,
                  datalabels: {
                    align: 'bottom',
                    color: '#e74c3c',
                    textStrokeColor: '#090d13',
                    textStrokeWidth: 4
                  }
                },
                {
                  type: 'bar',
                  label: 'Total Balance (USD)',
                  data: chartData.usd,
                  backgroundColor: chartData.usd.map(v => (v === null || v >= 0) ? colorBar : '#ef4444'),
                  yAxisID: 'yUsd',
                  borderRadius: 4,
                  datalabels: {
                    align: 'top',
                    color: '#f1f5f9',
                    textStrokeColor: '#090d13',
                    textStrokeWidth: 3
                  }
                }
              ]
            },
            options: commonOptions
          });
        };

        createChart('chartMonthly', data.monthly, '#38bdf8');
        createChart('chartWeekly', data.weekly, '#10b981');
        createChart('chartDaily', data.daily, '#64748b');
        
        if(data.monthly.stats) document.getElementById('statsMonthly').innerText = data.monthly.stats;
        if(data.weekly.stats) document.getElementById('statsWeekly').innerText = data.weekly.stats;
        if(data.daily.stats) document.getElementById('statsDaily').innerText = data.daily.stats;
        
        const renderTable = (tableId, trades) => {
            const table = document.getElementById(tableId);
            if(!trades || trades.length === 0) {
                table.innerHTML = "";
                return;
            }
            let html = `<thead>
                <tr>
                    <th>날짜</th>
                    <th>종목</th>
                    <th>전적</th>
                    <th>승률</th>
                    <th>총잔고</th>
                    <th>손익</th>
                    <th>수익률</th>
                </tr>
            </thead><tbody>`;
            trades.forEach(t => {
                const isNoTrade = t.total === 0;
                const pnlClass = t.pnl > 0 ? 'win-text' : (t.pnl < 0 ? 'loss-text' : '');
                const pctClass = t.pct > 0 ? 'win-text' : (t.pct < 0 ? 'loss-text' : '');
                const wrClass = t.total > 0 ? (t.win_rate >= 50 ? 'win-text' : 'loss-text') : '';
                
                const pnlSign = t.pnl > 0 ? '+$' : (t.pnl < 0 ? '-$' : '$');
                const pnlFormatted = isNoTrade ? '$0.00' : (pnlSign + Math.abs(t.pnl).toFixed(2));
                const pctSign = t.pct > 0 ? '+' : '';
                const pctFormatted = pctSign + t.pct.toFixed(2) + '%';
                const balFormatted = '$' + (t.balance !== null && t.balance !== undefined ? Number(t.balance).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0.00');
                const recordStr = isNoTrade ? '-' : `${t.wins}승 ${t.losses}패`;
                const wrStr = isNoTrade ? '-' : `${t.win_rate.toFixed(1)}%`;
                
                html += `<tr>
                    <td style="font-weight: 600; color: var(--text-main);">${t.date}</td>
                    <td style="color: #cbd5e1;">${t.symbol}</td>
                    <td>${recordStr}</td>
                    <td class="${wrClass}">${wrStr}</td>
                    <td style="color: #38bdf8; font-weight: 600;">${balFormatted}</td>
                    <td class="${pnlClass}">${pnlFormatted}</td>
                    <td class="${pctClass}">${pctFormatted}</td>
                </tr>`;
            });
            html += `</tbody>`;
            table.innerHTML = html;
        };

        renderTable('tableMonthly', data.monthly.trades);
        renderTable('tableWeekly', data.weekly.trades);
        renderTable('tableDaily', data.daily.trades);

      } catch (err) { console.error(err); }
    }
    fetchCharts();
  </script>
</body>
</html>
