<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumos Cockpit - Return Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #090d13;
      --bg-card: #131b26;
      --border-subtle: #233144;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: var(--font-sans); padding: 30px; }
    .header { margin-bottom: 30px; text-align: center; }
    .header h1 { font-size: 28px; font-weight: 700; }
    .charts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; text-align: center; color: var(--text-main); }
    .chart-container { position: relative; height: 300px; width: 100%; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Lumos Performance Dashboard</h1>
    <p style="color: var(--text-muted); margin-top: 5px;">달러 누적(Bar) & 수익률 복리 곡선(Line)</p>
  </div>
  <div class="charts-grid">
    <div class="card">
      <div class="card-title">월별 성과 (전월 대비)</div>
      <div class="chart-container"><canvas id="chartMonthly"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">주별 성과 (전주 대비 / 최근 5주)</div>
      <div class="chart-container"><canvas id="chartWeekly"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">일별 성과 (전일 대비)</div>
      <div class="chart-container"><canvas id="chartDaily"></canvas></div>
    </div>
  </div>
  <script>
    async function fetchCharts() {
      try {
        const res = await fetch('/api/return_charts');
        const data = await res.json();
        if (data.error) return console.error(data.error);

        const commonOptions = {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { color: '#94a3b8' } } },
          scales: {
            yUsd: { type: 'linear', position: 'left', grid: { color: '#233144' }, ticks: { color: '#38bdf8', callback: v => '$' + v } },
            yPct: { type: 'linear', position: 'right', grid: { display: false }, ticks: { color: '#e74c3c', callback: v => v + '%' } },
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          }
        };

        const createChart = (ctxId, chartData, colorBar) => {
          new Chart(document.getElementById(ctxId), {
            type: 'bar',
            data: {
              labels: chartData.labels,
              datasets: [
                {
                  type: 'line',
                  label: 'Yield (%)',
                  data: chartData.pct,
                  borderColor: '#e74c3c',
                  backgroundColor: '#e74c3c',
                  borderWidth: 2,
                  yAxisID: 'yPct',
                  tension: 0.1
                },
                {
                  type: 'bar',
                  label: 'Total Balance (USD)',
                  data: chartData.usd,
                  backgroundColor: chartData.usd.map(v => v >= 0 ? colorBar : '#ef4444'),
                  yAxisID: 'yUsd',
                  borderRadius: 4
                }
              ]
            },
            options: commonOptions
          });
        };

        createChart('chartMonthly', data.monthly, '#38bdf8');
        createChart('chartWeekly', data.weekly, '#10b981');
        createChart('chartDaily', data.daily, '#a855f7');
      } catch (err) { console.error(err); }
    }
    fetchCharts();
  </script>
</body>
</html>
